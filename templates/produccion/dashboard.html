<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Producción</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Fondo blanco y fuente principal */
        body {
            background: linear-gradient(135deg, #ffffff 0%, #fcfcfc 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        /* Espaciado para el contenedor principal */
        .dashboard-container {
            padding: 2rem 0;
        }
        /* Tarjeta de bienvenida centrada con sombra */
        .welcome-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 2rem;
            text-align: center;
        }
        /* Imagen de construcción */
        .construction-img {
            max-width: 300px;
            width: 100%;
            height: auto;
            margin: 2rem 0;
        }
        /* Botón de cierre de sesión en la esquina superior derecha */
        .logout-btn {
            position: absolute;
            top: 10px;
            right: 10px;
        }
        /* Estilo específico para el botón de cerrar sesión */
        .btn-logout {
            background-color: #bb1b0c; /* Rojo */
            border-color: #bb1b0c; /* Rojo */
            color: white; /* Texto blanco */
            padding: 10px; /* Tamaño de 10px como solicitado */
            font-weight: 500;
            transition: all 0.3s;
            border-radius: 8px;
        }
        
        .btn-logout:hover {
            background-color: #c82333; /* Rojo más oscuro */
            border-color: #c82333; /* Rojo más oscuro */
            color: white; /* Texto blanco en hover también */
            transform: translateY(-2px);
        }
        /* Texto e íconos en negro puro */
        .black-text {
            color: #000000 !important; /* Negro puro */
        }
        .black-icon {
            color: #000000 !important; /* Negro puro para el icono */
        }
        /* Agregando estilos para las tarjetas de acción */
        .action-card {
            background: white;
            border-radius: 10px;
            padding: 1.5rem;
            margin: 1rem 0;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        .action-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
        }
        .action-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: #0d3c83;
        }
    </style>
</head>
<body>
    <div class="logout-btn">
        <a href="{{ url_for('auth.logout') }}" class="btn btn-logout">
            <i class="fas fa-sign-out-alt"></i> Cerrar sesión
        </a>
    </div>

    <div class="container dashboard-container">
        <div class="row justify-content-center">
            <div class="col-md-10">
               
                <div class="welcome-card">
                    <h1 class="display-4 black-text mb-3">
                        <i class="fas fa-cogs black-icon"></i> Bienvenido, {{ nombre }}
                    </h1>
                    <p class="lead text-muted">Área: {{ rol }}</p>
                    
                    <div class="row mt-5">
                        <div class="col-md-12">
                            <a href="{{ url_for('produccion.ver_pedidos') }}" class="text-decoration-none">
                                <div class="action-card">
                                    <i class="fas fa-list-alt action-icon"></i>
                                    <h4 class="black-text">Ver Pedidos Programados</h4>
                                    <p class="text-muted">Consultar pedidos programados para producción</p>
                                </div>
                            </a>
                        </div>
                        <div class="col-md-12">
                            <a href="{{ url_for('produccion.ver_pedidos_pagados') }}" class="text-decoration-none">
                                <div class="action-card">
                                    <i class="fas fa-check-circle action-icon"></i>
                                    <h4 class="black-text">Ver Pedidos Pagados</h4>
                                    <p class="text-muted">Consultar pedidos con estado de pago completado</p>
                                </div>
                                <div class="col-md-12">
        <a href="{{ url_for('produccion.ver_pedidos_archivados_produccion') }}" class="text-decoration-none">
            <div class="action-card">
                <i class="fas fa-box-archive action-icon" style="color: #0d3c83;"></i>
                <h4 class="black-text">Ver Pedidos Archivados</h4>
                <p class="text-muted">Consultar pedidos que ya fueron archivados</p>
            </div>
        </a>
    </div>
</div>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  // Prevenir navegación con historial después de cerrar sesión
  if (window.history && window.history.pushState) {
      window.history.pushState(null, "", window.location.href);
      window.onpopstate = function () {
          window.location.replace("{{ url_for('auth.logout') }}");
      };
  }

  window.addEventListener("pageshow", function (event) {
      if (event.persisted || (window.performance && window.performance.navigation.type === 2)) {
          window.location.replace("{{ url_for('auth.logout') }}");
      }
  });
</script>

</body>
</html>
