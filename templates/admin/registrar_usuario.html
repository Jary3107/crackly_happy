<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Metadatos y enlaces a Bootstrap y FontAwesome para estilos e íconos -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Variables CSS para colores y estilos base */
        :root {
            --primary-color: #22a764;
            --primary-hover: #26684c;
            --secondary-color: #f8f9fa;
            --text-color: #333;
            --border-color: #ddd;
            --error-color: #dc2626;
            --success-color: #16a34a;
        }
        /* Estilos generales de la página */
        body {
            background-color: #f5f7fa;
            color: var(--text-color);
            line-height: 1.6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            position: relative;
        }
        /* Botón de volver arriba a la izquierda */
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
        }
        .back-btn a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 15px;
            border: 2px solid var(--primary-color);
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .back-btn a:hover {
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
        }
        /* Contenedor principal del formulario */
        .registro-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 40px;
            background-color: #fff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            position: relative;
        }
        /* Título del formulario */
        h2 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 600;
        }
        /* Grid para organizar los campos del formulario */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group.full-width {
            grid-column: 1 / -1;
        }
        /* Etiquetas de los campos */
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-color);
        }
        /* Campos de entrada y select */
        input[type="text"],
        input[type="email"],
        input[type="password"],
        select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s ease;
            background-color: #fff;
        }
        input:focus,
        select:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 0 3px rgba(34, 167, 100, 0.2);
        }
        /* Botón de envío */
        button[type="submit"] {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: 500;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s ease;
        }
        button[type="submit"]:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
        }
        /* Mensajes flash de éxito o error */
        .flashes {
            list-style: none;
            padding: 0;
            margin-bottom: 25px;
        }
        .flashes li {
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-weight: 500;
            text-align: center;
        }
        .danger {
            background-color: #fef2f2;
            color: #991b1b;
            border-left: 4px solid var(--error-color);
        }
        .success {
            background-color: #f0fdf4;
            color: #166534;
            border-left: 4px solid var(--success-color);
        }
        /* Pista para la contraseña */
        .password-hint {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
        /* Asterisco para campos obligatorios */
        .field-required::after {
            content: " *";
            color: var(--error-color);
        }
        /* Responsividad para pantallas pequeñas */
        @media (max-width: 768px) {
            .registro-container {
                padding: 25px;
                margin: 20px;
            }
            .form-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            .back-btn {
                top: 15px;
                left: 15px;
            }
            h2 {
                margin-top: 40px;
            }
        }
    </style>
</head>
<body>
    <!-- Botón Volver arriba a la izquierda -->
    <div class="back-btn">
        <a href="{{ url_for('admin.dashboard') }}">
            <i class="fas fa-arrow-left"></i>Volver
        </a>
    </div>

    <div class="registro-container">
        <!-- Título del formulario -->
        <h2><i class="fas fa-user-plus me-2"></i>Registrar Nuevo Usuario</h2>

        <!-- Mostrar mensajes flash de éxito o error -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <ul class="flashes">
                    {% for category, message in messages %}
                        <li class="{{ category }}">{{ message }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}

        <!-- Formulario de registro de usuario -->
        <form action="{{ url_for('admin.registrar_usuario') }}" method="POST" class="form-grid" id="registerForm">
            <!-- Información Personal -->
            <div class="form-group">
                <label for="nombre" class="field-required">Nombre completo</label>
                <input type="text" id="nombre" name="nombre" value="{{ datos.nombre if datos else '' }}" required>
            </div>
            <div class="form-group">
                <label for="cc" class="field-required">Cédula</label>
                <input type="text" id="cc" name="cc" value="{{ datos.cc if datos else '' }}" required>
            </div>
            <div class="form-group">
                <label for="telefono" class="field-required">Teléfono</label>
                <input type="text" id="telefono" name="telefono" value="{{ datos.telefono if datos else '' }}" required minlength="10">
            </div>
            <div class="form-group">
                <label for="sexo" class="field-required">Sexo</label>
                <select id="sexo" name="sexo" required>
                    <option value="">Seleccione...</option>
                    <option value="Masculino" {% if datos and datos.sexo == 'Masculino' %}selected{% endif %}>Masculino</option>
                    <option value="Femenino" {% if datos and datos.sexo == 'Femenino' %}selected{% endif %}>Femenino</option>
                    <option value="Otro" {% if datos and datos.sexo == 'Otro' %}selected{% endif %}>Otro</option>
                </select>
            </div>
            <!-- Información de Contacto -->
            <div class="form-group full-width">
                <label for="correo" class="field-required">Correo electrónico</label>
                <input type="email" id="correo" name="correo" value="{{ datos.correo if datos else '' }}" required>
            </div>
            <div class="form-group">
                <label for="rol" class="field-required">Rol del usuario</label>
                <select id="rol" name="rol" required>
                    <option value="">Seleccione...</option>
                    <option value="Comercial" {% if datos and datos.rol == 'Comercial' %}selected{% endif %}>Comercial</option>
                    <option value="Produccion" {% if datos and datos.rol == 'Produccion' %}selected{% endif %}>Producción</option>
                    <option value="Facturacion" {% if datos and datos.rol == 'Facturacion' %}selected{% endif %}>Facturación</option>
                </select>
            </div>
            <!-- Contraseña -->
            <div class="form-group full-width">
                <label for="contrasena" class="field-required">Contraseña</label>
                <input type="password" id="contrasena" name="contrasena" required>
                <div class="password-hint">
                    <i class="fas fa-info-circle"></i> Mínimo 8 caracteres con mayúsculas, minúsculas, números y símbolos
                </div>
            </div>
            <!-- Información de Ubicación -->
            <div class="form-group full-width">
                <label for="direccion">Dirección</label>
                <input type="text" id="direccion" name="direccion" value="{{ datos.direccion if datos else '' }}" placeholder="Calle, número, complemento">
            </div>
            <div class="form-group">
                <label for="municipio">Municipio</label>
                <input type="text" id="municipio" name="municipio" value="{{ datos.municipio if datos else '' }}">
            </div>
            <div class="form-group">
                <label for="departamento">Departamento</label>
                <input type="text" id="departamento" name="departamento" value="{{ datos.departamento if datos else '' }}">
            </div>
            <!-- Botón de envío -->
            <div class="form-group full-width">
                <button type="submit">
                    <i class="fas fa-user-plus me-2"></i>Registrar Usuario
                </button>
            </div>
        </form>
    </div>

    <script>
        // Validación del formulario en el cliente antes de enviar
        function validarFormulario(e) {
            const correo = document.getElementById('correo').value;
            const contrasena = document.getElementById('contrasena').value;
            const nombre = document.getElementById('nombre').value;
            const cc = document.getElementById('cc').value;
            const telefono = document.getElementById('telefono').value;
            const rol = document.getElementById('rol').value;
            const sexo = document.getElementById('sexo').value;
            
            // Validar campos obligatorios
            if (!nombre.trim() || !cc.trim() || !telefono.trim() || !correo.trim() || 
                !contrasena.trim() || !rol.trim() || !sexo.trim()) {
                alert("Por favor completa todos los campos obligatorios");
                e.preventDefault();
                return false;
            }
            // Validar email
            if (!/^[\w.-]+@[\w.-]+\.[a-zA-Z]{2,}$/.test(correo)) {
                alert("Por favor ingrese un correo electrónico válido.");
                e.preventDefault();
                return false;
            }
            // Validar teléfono (solo números, mínimo 10 dígitos)
            if (!/^\d{10,15}$/.test(telefono)) {
                alert("El teléfono debe contener solo números y tener entre 10 y 15 dígitos.");
                e.preventDefault();
                return false;
            }
            // Validar contraseña segura
            if (!/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[\W_]).{8,}$/.test(contrasena)) {
                alert("La contraseña debe tener al menos 8 caracteres, incluyendo mayúsculas, minúsculas, números y un carácter especial.");
                e.preventDefault();
                return false;
            }
            // Validar cédula (solo números)
            if (!/^\d+$/.test(cc)) {
                alert("La cédula debe contener solo números.");
                e.preventDefault();
                return false;
            }
            return true;
        }

        // Inicialización de eventos al cargar la página
        document.addEventListener('DOMContentLoaded', function() {
            // Validar formulario al enviar
            document.getElementById('registerForm').addEventListener('submit', validarFormulario);
            // Formatear cédula para que solo acepte números
            document.getElementById('cc').addEventListener('input', function(e) {
                this.value = this.value.replace(/\D/g, '');
            });
            // Formatear teléfono para que solo acepte números
            document.getElementById('telefono').addEventListener('input', function(e) {
                this.value = this.value.replace(/\D/g, '');
            });
        });
    </script>
</body>
</html>
