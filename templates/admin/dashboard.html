<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Metadatos y enlaces a Bootstrap y FontAwesome para estilos e íconos -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Estilos personalizados para el dashboard */
        body {
            background: linear-gradient(135deg, #ffffff 0%, #ffffff 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .dashboard-container {
            padding: 2rem 0;
        }
        .welcome-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 2rem;
            margin-bottom: 2rem;
        }
        .action-card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            text-align: center;
            transition: transform 0.3s ease;
        }
        .action-card:hover {
            transform: translateY(-5px);
        }
        .btn-admin {
            background: linear-gradient(45deg, #8bb615, #066aec);
            border: none;
            color: white;
            padding: 1rem 2rem;
            border-radius: 50px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        .btn-admin:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            color: rgb(255, 255, 255);
        }
        .logout-btn {
            position: absolute;
            top: 20px;
            right: 20px;
        }
        .logout-btn .btn {
            font-weight: 600; /* Texto en negrita */
            border-width: 2px; /* Borde más grueso */
        }
        .black-text {
            color: #000000 !important;
        }
        .black-icon {
            color: #000000 !important;
        }
        .construction-img {
            max-width: 250px;
            width: 100%;
            height: auto;
            margin: 1.5rem 0;
        }
        .welcome-title {
            font-size: 2.5rem;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <!-- Botón de cierre de sesión en la esquina superior derecha -->
    <div class="logout-btn">
        <a href="{{ url_for('auth.logout') }}" class="btn btn-outline-dark">
            <i class="fas fa-sign-out-alt"></i> Cerrar sesión
        </a>
    </div>

    <div class="container dashboard-container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <!-- Tarjeta de bienvenida con el nombre del usuario -->
                <div class="welcome-card text-center">
                    <h1 class="welcome-title black-text mb-3">
                        <i class="fas fa-user-shield black-icon"></i> Bienvenido, {{ nombre }}
                    </h1>
                    <p class="lead text-muted">Panel de administración</p>
                </div>

                <div class="row">
                    <div class="col-md-12">
                        <!-- Tarjeta de acción principal para registrar usuarios -->
                        <div class="action-card">
                            <div class="mb-4">
                                <i class="fas fa-user-plus fa-4x black-icon mb-3"></i>
                                <h3 class="black-text">Crear cuentas para integrantes del personal</h3>
                                <p class="text-muted">Roles: Comercial - Producción - Facturación</p>
                            </div>
                            <!-- Botón para ir al registro de usuario -->
                            <a href="{{ url_for('admin.registrar_usuario') }}" class="btn btn-admin">
                                <i class="fas fa-plus-circle"></i> Registrar usuario
                            </a>
                            
                            <!-- Imagen de construcción y mensaje de futuras funcionalidades -->
                            <div class="mt-4">
                                <img src="{{ url_for('static', filename='images/construccion.png') }}" 
                                     alt="En construcción" class="construction-img">
                                <p class="text-muted small mt-2">Construyendo, más funcionalidades próximamente</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Prevenir navegación con historial después de cerrar sesión
        if (window.history && window.history.pushState) {
            window.history.pushState(null, "", window.location.href);
            window.onpopstate = function () {
                window.location.replace("{{ url_for('auth.logout') }}");
            };
        }

        window.addEventListener("pageshow", function (event) {
            if (event.persisted || (window.performance && window.performance.navigation.type === 2)) {
                window.location.replace("{{ url_for('auth.logout') }}");
            }
        });
    </script>
</body>
</html>
